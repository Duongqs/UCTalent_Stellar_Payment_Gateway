steps:
  - name: 'node:20-alpine'
    entrypoint: 'npm'
    args: ['ci']

  - name: 'node:20-alpine'
    entrypoint: 'npm'
    args: ['run', 'build']

  - name: 'node:20-alpine'
    entrypoint: 'npm'
    args: ['run', 'test:e2e', '--workspaces', '--if-present']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/uc-cross-border-api:$COMMIT_SHA'
      - '-f'
      - 'Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/uc-cross-border-worker:$COMMIT_SHA'
      - '-f'
      - 'Dockerfile.worker'
      - '.'

images:
  - 'gcr.io/$PROJECT_ID/uc-cross-border-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/uc-cross-border-worker:$COMMIT_SHA'
